name: Release PT plugin
on:
  push:
    tags: ['PTSignInKeeper_v*', 'PTInviteKeeper_v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '插件标签：PTSignInKeeper_vX.Y.Z 或 PTInviteKeeper_vX.Y.Z'
        required: true
permissions:
  contents: write
concurrency:
  group: pt-keepers-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test both plugins on MoviePilot V2 and V3
        run: bash scripts/test.sh
      - name: Validate and package
        run: |
          python3 scripts/check_release.py
          python3 scripts/build_v2.py --check
          git diff --exit-code -- plugins.v3/*/dist plugins.v2
          python3 scripts/package_release.py --tag "$RELEASE_TAG"
      - name: Publish one release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/publish_release.py --tag "$RELEASE_TAG"
